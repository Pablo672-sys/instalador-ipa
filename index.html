<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPA Inspector</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --border: #38383a;
            --blue: #0a84ff;
            --text: #ffffff;
            --text-sec: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-sec);
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .upload-box {
            background-color: var(--card);
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            cursor: pointer;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn-text {
            color: var(--blue);
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            display: block;
        }

        /* Card de Informações do App */
        #info-container {
            display: none;
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 0.5px solid var(--border);
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-sec);
        }

        .info-value {
            font-weight: 600;
            color: var(--text);
            word-break: break-all;
            text-align: right;
            max-width: 200px;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            color: #34c759;
            text-align: center;
        }
    </style>

    <!-- Biblioteca JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <h2>IPA Inspector</h2>
    <p>Adicione o .ipa para inspecionar o pacote</p>

    <div class="upload-box" onclick="document.getElementById('ipaInput').click()">
        <span style="font-size: 32px;">📦</span>
        <span class="upload-btn-text">Selecionar arquivo .ipa</span>
        <input type="file" id="ipaInput" accept=".ipa" onchange="processarIpa(event)">
    </div>

    <div id="status"></div>

    <!-- Painel com os dados do IPA -->
    <div id="info-container">
        <div class="info-row">
            <span class="info-label">Arquivo:</span>
            <span class="info-value" id="valName">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">Tamanho:</span>
            <span class="info-value" id="valSize">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">AppName (.app):</span>
            <span class="info-value" id="valApp">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">Status:</span>
            <span class="info-value" style="color: #34c759;">Lido com Sucesso</span>
        </div>
    </div>

    <script>
        async function processarIpa(event) {
            const file = event.target.files[0];
            const statusDiv = document.getElementById('status');
            const infoContainer = document.getElementById('info-container');
            
            const valName = document.getElementById('valName');
            const valSize = document.getElementById('valSize');
            const valApp = document.getElementById('valApp');

            if (!file) return;

            statusDiv.innerHTML = "Lendo estrutura interna do IPA...";
            infoContainer.style.display = 'none';

            try {
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);

                let appFolderName = "Não encontrado";

                // Procura a pasta principal do aplicativo nativo dentro do Payload
                for (let filename of Object.keys(zipContent.files)) {
                    if (filename.includes('Payload/') && filename.endsWith('.app/')) {
                        const parts = filename.split('/');
                        for (let p of parts) {
                            if (p.endsWith('.app')) {
                                appFolderName = p;
                                break;
                            }
                        }
                        break;
                    }
                }

                // Preenche os dados na tela
                valName.innerText = file.name;
                valSize.innerText = (file.size / (1024 * 1024)).toFixed(2) + " MB";
                valApp.innerText = appFolderName;

                statusDiv.innerHTML = "✅ Pacote inspecionado com sucesso!";
                infoContainer.style.display = 'block';

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "❌ Erro ao ler o arquivo IPA.";
            }
        }
    </script>

</body>
</html>
