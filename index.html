<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPA .app Reader</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --border: #38383a;
            --blue: #0a84ff;
            --text: #ffffff;
            --text-sec: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-sec);
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .upload-box {
            background-color: var(--card);
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            cursor: pointer;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn-text {
            color: var(--blue);
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            display: block;
        }

        #result-container {
            display: none;
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }

        .app-header-view {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 0.5px solid var(--border);
            padding-bottom: 15px;
        }

        #appIconImg {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: #2c2c2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            object-fit: cover;
        }

        .app-meta {
            margin-left: 15px;
        }

        .app-name-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .app-sub {
            font-size: 13px;
            color: var(--text-sec);
            margin: 0;
        }

        .file-list {
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            color: var(--text-sec);
            background: #000;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            border: 0.5px solid var(--border);
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            color: #34c759;
            text-align: center;
        }
    </style>

    <!-- Biblioteca JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <h2>Leitor de IPA (.app)</h2>
    <p>Carregue o pacote para ler os arquivos internos</p>

    <div class="upload-box" onclick="document.getElementById('ipaInput').click()">
        <span style="font-size: 32px;">📱</span>
        <span class="upload-btn-text">Selecionar arquivo .ipa</span>
        <input type="file" id="ipaInput" accept=".ipa" onchange="lerAppInterno(event)">
    </div>

    <div id="status"></div>

    <div id="result-container">
        <div class="app-header-view">
            <div id="appIconImg">📦</div>
            <div class="app-meta">
                <div class="app-name-title" id="appNameTitle">App Nativo</div>
                <div class="app-sub" id="appFolderName">-</div>
            </div>
        </div>
        <div style="font-size: 13px; color: var(--text-sec); margin-bottom: 5px;">Estrutura interna encontrada:</div>
        <div class="file-list" id="fileListContent"></div>
    </div>

    <script>
        async function lerAppInterno(event) {
            const file = event.target.files[0];
            const statusDiv = document.getElementById('status');
            const resultContainer = document.getElementById('result-container');
            const appFolderNameElem = document.getElementById('appFolderName');
            const appNameTitle = document.getElementById('appNameTitle');
            const fileListContent = document.getElementById('fileListContent');
            const appIconImg = document.getElementById('appIconImg');

            if (!file) return;

            statusDiv.innerHTML = "Lendo pacote .app interno...";
            resultContainer.style.display = 'none';

            try {
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);

                let appPathPrefix = null;
                let folderName = "";
                let arquivosInternos = [];

                // Varre o arquivo ZIP para achar a pasta .app dentro de Payload
                for (let filename of Object.keys(zipContent.files)) {
                    if (filename.includes('Payload/') && filename.includes('.app/')) {
                        let parts = filename.split('/');
                        let appIndex = parts.findIndex(p => p.endsWith('.app'));
                        if (appIndex !== -1) {
                            folderName = parts[appIndex];
                            appPathPrefix = parts.slice(0, appIndex + 1).join('/') + '/';
                            break;
                        }
                    }
                }

                if (appPathPrefix) {
                    appNameTitle.innerText = folderName.replace('.app', '');
                    appFolderNameElem.innerText = folderName;

                    // Coleta uma lista dos arquivos de dentro do .app para exibir
                    for (let filename of Object.keys(zipContent.files)) {
                        if (filename.startsWith(appPathPrefix)) {
                            let relPath = filename.replace(appPathPrefix, '');
                            if (relPath.length > 0) {
                                arquivosInternos.push(relPath);
                            }
                        }
                    }

                    fileListContent.innerHTML = arquivosInternos.slice(0, 50).join('<br>');
                    if (arquivosInternos.length > 50) {
                        fileListContent.innerHTML += `<br><em>...e mais ${arquivosInternos.length - 50} arquivos.</em>`;
                    }

                    statusDiv.innerHTML = "✅ Pasta .app lida com sucesso!";
                    resultContainer.style.display = 'block';
                } else {
                    statusDiv.innerHTML = "⚠️ Estrutura .app não localizada no formato padrão.";
                }

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "❌ Erro ao processar o pacote.";
            }
        }
    </script>

</body>
</html>
