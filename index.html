<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Instalador IPA</title>
    
    <!-- Configurações para virar App no iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Instalador">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #888; font-size: 14px; margin-bottom: 30px; }
        .box {
            background: #1e1e1e;
            border: 2px dashed #333;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        input[type="file"] {
            margin-top: 15px;
            color: #fff;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Instalador IPA Web</h1>
    <p>Adicione à Tela de Início pelo Safari para usar</p>

    <div class="box">
        <label for="arquivoIpa">Selecione o arquivo .ipa do seu celular:</label><br>
        <input type="file" id="arquivoIpa" accept=".ipa">
    </div>

    <button onclick="iniciarInstalacao()">Instalar App</button>

    <script>
        function iniciarInstalacao() {
            const input = document.getElementById('arquivoIpa');
            if (input.files.length === 0) {
                alert('Por favor, selecione um arquivo .ipa primeiro!');
                return;
            }
            
            const nomeArquivo = input.files[0].name;
            alert('Arquivo selecionado: ' + nomeArquivo + '\nTentando processar...');
            
            // Aqui entraria a lógica que você mencionou para processar o arquivo
        }
    </script>

</body>
</html>
