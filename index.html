<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emulador IPA Web</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Emulador">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0b0e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 20px; margin-bottom: 5px; }
        p { color: #888; font-size: 13px; margin-bottom: 20px; text-align: center; }
        
        .upload-card {
            background: #16161a;
            border: 1px solid #2a2a33;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        input[type="file"] {
            width: 100%;
            color: #ccc;
            font-size: 13px;
        }

        /* O "Visual de Aparelho / Emulador" */
        #emulator-container {
            display: none;
            width: 100%;
            max-width: 350px;
            height: 550px;
            background: #000;
            border: 4px solid #333;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .loading {
            color: #00ff88;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
    
    <!-- Biblioteca JSZip para abrir o arquivo IPA por dentro do navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <h1>Emulador Web de IPA</h1>
    <p>Selecione o .ipa para carregar e rodar direto no navegador</p>

    <div class="upload-card">
        <label><b>Selecione o arquivo .ipa:</b></label>
        <input type="file" id="ipaFile" accept=".ipa" onchange="carregarIpa(event)">
        <div id="status" class="loading"></div>
    </div>

    <!-- Tela do Emulador -->
    <div id="emulator-container">
        <iframe id="appFrame"></iframe>
    </div>

    <script>
        async function carregarIpa(event) {
            const file = event.target.files[0];
            const statusDiv = document.getElementById('status');
            const emulatorBox = document.getElementById('emulator-container');
            const appFrame = document.getElementById('appFrame');

            if (!file) return;

            statusDiv.innerHTML = "Lendo estrutura do .ipa...";
            emulatorBox.style.display = 'none';

            try {
                // Como o IPA é um arquivo compactado ZIP, nós lemos ele por dentro
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);

                statusDiv.innerHTML = "Procurando arquivos executáveis/web...";

                // Otimização: O emulador busca por arquivos HTML/App dentro do pacote
                let htmlFileKey = null;
                
                // Varre os arquivos internos do IPA
                let filesKeys = Object.keys(zipContent.files);
                for (let key of filesKeys) {
                    if (key.endsWith('.html') || key.endsWith('.htm')) {
                        htmlFileKey = key;
                        break;
                    }
                }

                if (htmlFileKey) {
                    statusDiv.innerHTML = "Carregando o app no emulador...";
                    
                    // Extrai o conteúdo do arquivo principal do app
                    const fileData = await zipContent.files[htmlFileKey].async("blob");
                    const appUrl = URL.createObjectURL(fileData);

                    // Joga o app para rodar dentro do iframe (o visual de emulador)
                    appFrame.src = appUrl;
                    emulatorBox.style.display = 'block';
                    statusDiv.innerHTML = "✅ App rodando no emulador com sucesso!";
                } else {
                    statusDiv.innerHTML = "⚠️ Este .ipa é nativo puro (Binário iOS/Swift). O navegador roda pacotes web HTML5. Se for um app web empacotado, ele vai rodar aqui dentro!";
                }

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "❌ Erro ao ler o arquivo IPA.";
            }
        }
    </script>

</body>
</html>
