<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instalador IPA</title>
    
    <!-- Configurações para virar App no iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Instalador">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0b0e;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 { font-size: 24px; margin-bottom: 5px; }
        p { color: #888; font-size: 14px; margin-bottom: 25px; }
        .card {
            background: #16161a;
            border: 1px solid #2a2a33;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        input[type="file"] {
            margin-top: 15px;
            color: #ccc;
            font-size: 14px;
        }
        button {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 15px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,122,255,0.4);
        }
        button:active { transform: scale(0.98); }
        #status {
            margin-top: 20px;
            font-size: 15px;
            color: #00ff88;
            font-weight: bold;
        }
        .progress-container {
            width: 100%;
            background: #2a2a33;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            width: 0%;
            height: 10px;
            background: #00ff88;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <h1>Instalador IPA</h1>
    <p>Selecione o arquivo e inicie o processo</p>

    <div class="card">
        <label for="arquivoIpa"><b>Escolha o arquivo .ipa:</b></label><br>
        <input type="file" id="arquivoIpa" accept=".ipa">
    </div>

    <button onclick="processarIpa()">Processar e Instalar</button>

    <div class="progress-container" id="progressBox">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="status"></div>

    <script>
        function processarIpa() {
            const input = document.getElementById('arquivoIpa');
            const statusDiv = document.getElementById('status');
            const progressBox = document.getElementById('progressBox');
            const progressBar = document.getElementById('progressBar');

            if (input.files.length === 0) {
                alert('Por favor, selecione um arquivo .ipa primeiro!');
                return;
            }

            const arquivo = input.files[0];
            statusDiv.innerHTML = `Lendo o arquivo: ${arquivo.name}...`;
            progressBox.style.display = 'block';
            progressBar.style.width = '10%';

            // Simulando o carregamento/processamento do app escolhido
            setTimeout(() => {
                progressBar.style.width = '50%';
                statusDiv.innerHTML = `Preparando ${arquivo.name} para o dispositivo...`;
            }, 1000);

            setTimeout(() => {
                progressBar.style.width = '100%';
                statusDiv.innerHTML = `✅ App ${arquivo.name} processado com sucesso!`;
            }, 2500);
        }
    </script>

</body>
</html>
